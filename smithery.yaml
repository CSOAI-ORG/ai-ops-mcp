name: ai-ops-mcp
description: 'Ai Ops MCP server. Tools: system health check, check service, security
  scan. Built by MEOK AI Labs.'
version: 1.0.0
tools:
- name: system_health_check
  description: "Comprehensive system health check \u2014 CPU, memory, disk, services."
  parameters: []
- name: check_service
  description: Check if a specific HTTP service is healthy.
  parameters:
  - name: url
    type: string
    required: true
- name: security_scan
  description: "Run security scan \u2014 check for common vulnerabilities, open ports,\
    \ outdated packages."
  parameters:
  - name: target
    type: string
    required: false
- name: get_process_status
  description: Get status of running AI-related processes.
  parameters: []
- name: maintenance_schedule
  description: Get recommended maintenance actions based on system state.
  parameters: []
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
    - apiKey
    properties:
      apiKey:
        type: string
        description: Your MEOK API Key
  commandFunction: "(config) => ({\n  command: 'uvx',\n  args: ['ai-ops-mcp', '--api-key',\
    \ config.apiKey],\n  env: {\n    MEOK_API_KEY: config.apiKey\n  }\n})"
